# pnpm 11 配置模型（ADR-005 v2）：非「注册源/认证」类设置一律写在此处，写入 .npmrc 在 pnpm 11 下不生效。
packages:
  - 'apps/*'
  - 'packages/*'

# 版本不符必须显式失败；默认值 download 在离线/信创环境等于一次无声联网（ADR-005 致命细节）。
pmOnFail: error
# 严格 engines：node >=22.13 <23 不满足即拒绝安装。
engineStrict: true
nodeLinker: isolated
# 版本锚定从「文档纪律」升级为包管理器行为。
saveExact: true
# 必须关掉：否则 @nestjs/swagger 的 peer 会把 class-validator/class-transformer 静默装回依赖树，
# 击穿「zod 单一 schema 源」（P3-001 裁决 ②）。
autoInstallPeers: false
# 构建脚本白名单（pnpm 11 取代 onlyBuiltDependencies）。
# @scarf/scarf 显式关：swagger-ui-dist 的传递依赖带 postinstall 外联 scarf.sh。
strictDepBuilds: true
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  # P3-011-01 裁决（jest 30 的两个原生传递依赖，2026-10-24 实测）：
  # 两者都由 jest 引入——@parcel/watcher ← jest-haste-map（文件监听）、
  # unrs-resolver ← jest-resolve（模块解析）。显式 false 而非放行，理由三条：
  # ① 平台预编译 binding 已成对落盘（@parcel/watcher-win32-x64@2.6.0 /
  #    @unrs/resolver-binding-win32-x64-msvc@1.12.2），其 install/postinstall 在本目标为 no-op；
  # ② 忽略构建下 `jest --listTests` exit=0、真实用例（ts-jest + @nestjs/testing DI）跑绿，
  #    说明无需源码编译即可工作（实测见 ANCHORS §3 P3-011-01 执行记录）；
  # ③ 放行 true 会把 node-gyp 与网络下载面引入信创/离线环境（ADR-005 最小构建面原则）。
  # 若换到无预编译包的平台（如某些 ARM 信创发行版），这两条必须改判为 true 并重测。
  '@parcel/watcher': false
  unrs-resolver: false
  # SB-02 引入（2026-10-25，@univerjs/protocol → @grpc/grpc-js → @grpc/proto-loader）。
  # 其 postinstall 只读取上层 package.json 并打印版本方案不一致警告，不编译、不联网、
  # 不写产物——读源码 scripts/postinstall.js 确认（首个 `if (!pkg.versionScheme) return` 后
  # 仅 process.stderr.write）。按 ADR-005 最小构建面原则显式 false。
  # 若升级到真正做代码生成/下载的 protobufjs 版本，此条必须改判为 true 并重测。
  protobufjs: false
# catalog 本包只登记 @univerjs/*；待 P3-030 引入时按实况补条目，不留空 catalog。
# catalog:
#   '@univerjs/*': 1.0.2
